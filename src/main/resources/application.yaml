# ============================================================================
# 커밋되는 설정 파일. **여기에 비밀번호/API 키를 직접 쓰지 말 것.**
#
# 값 주입 우선순위 (뒤로 갈수록 우선):
#   1) 이 파일의 ${ENV:기본값}  ← CI/배포용
#   2) application-local.yaml   ← 로컬 개발용 (gitignore 처리됨)
#
# spring.profiles.default: local 덕분에 프로필을 지정하지 않아도
# application-local.yaml 이 자동으로 로드된다. 파일이 없어도 부팅은 된다.
#
# 최초 세팅: application-local.yaml.example 를 복사해서
#            application-local.yaml 로 만들고 실제 값 채우기.
# ============================================================================

spring:
  application:
    name: hormone-web-backend

  profiles:
    default: local

  devtools:
    restart:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hormone_web}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # 스키마는 db/schema.sql 이 유일한 진실. 전부 CREATE TABLE IF NOT EXISTS 라
  # 매 부팅 실행돼도 안전하다. 처음부터 다시 만들려면 db/drop.sql 을 수동 실행할 것.
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

  jpa:
    hibernate:
      # 엔티티가 테이블을 자동 생성/변경하지 않게 none 을 유지할 것 (S-03).
      ddl-auto: none
    show-sql: true
    # schema.sql 이 먼저 돌고 나서 EntityManagerFactory 가 뜨도록 보장
    defer-datasource-initialization: false
    # TODO(B-02): DTO 계층 도입 후 open-in-view: false 로 바꿀 것.
    #   지금은 컨트롤러가 LAZY User 를 물고 있는 엔티티를 그대로 직렬화하므로
    #   OSIV 를 끄면 LazyInitializationException 이 난다.

  jackson:
    default-property-inclusion: NON_NULL

server:
  port: ${SERVER_PORT:8085}

# ============================================================================
# 애플리케이션 설정
# ============================================================================
app:
  cors:
    # 프론트 개발 서버(Vite). ★ 포트를 못 박지 않는다 — Vite 는 지정 포트가 쓰이면
    # 말없이 다음 포트로 옮겨가고(5173 은 Windows IP Helper 가 점유), 그때마다
    # CORS 403 이 나서 "백엔드가 죽었나?" 로 오해하게 된다. WebConfig 주석 참고.
    # TODO: 운영 배포 시 실제 도메인으로 제한 (B-03)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

  ws:
    endpoint: /ws
    prediction-topic-prefix: /topic/prediction/

  model:
    # 파이썬 예측 서버. ⚠️ 내장 Mock 을 제거했으므로 이 주소가 살아 있어야 예측이 나온다.
    base-url: ${MODEL_BASE_URL:http://127.0.0.1:5000}
    # ★ GET /api/predict?days=N  — 모델팀 실제 서버(hormone-web-model/app.py) 기준.
    #   예전 계약서의 POST /predict 는 폐기됐다.
    predict-path: ${MODEL_PREDICT_PATH:/api/predict}
    health-path: ${MODEL_HEALTH_PATH:/api/health}
    # 일차를 싣는 쿼리 파라미터 이름. 이름은 days 그대로고 의미만 바뀌었다
    # (예전: 1~N일 전체 / 지금: N일차 하나). 이름이 day 로 바뀌면 MODEL_DAY_PARAM=day.
    day-param: ${MODEL_DAY_PARAM:days}
    # ★ 일차 정렬 보정. 파이썬에 보낼 일차 = 백엔드 Day + 이 값.
    #   0 이 정답이다 — 시드를 모델 기준(day_index 1 = day_in_study 869)에 맞춰
    #   앞 7일을 잘라냈다(90일 -> 83일). 즉 웹 Day N == 모델 day_index N.
    #   모델팀이 기준일을 바꾸면 여기서 흡수한다(재빌드 불필요).
    day-offset: ${MODEL_DAY_OFFSET:0}
    # 모델이 modelVersion 을 안 줄 때 헤더 배지에 쓸 이름. 모델이 주면 그쪽이 이긴다.
    # ⚠️ 모델이 교체되면 이 값도 손으로 같이 고칠 것 (자동으로 안 바뀐다).
    fallback-version: ${MODEL_VERSION_LABEL:python-v1}
    connect-timeout-ms: 3000
    read-timeout-ms: 30000
    # TODO: 인증 방식 모델팀 확인. 비어 있으면 헤더를 붙이지 않는다.
    api-key: ${MODEL_API_KEY:}

  demo:
    user-id: 1
    start-date: 2026-08-13
    # 시드가 있으면 seed_data.json 의 값이 이깁니다. 아래는 시드가 없을 때만 씁니다.
    # 83 = day_in_study 869~951. 모델 day_index 1 이 869 라 거기에 맞췄다(§day-offset).
    total-days: 83
    # 15 = 첫 예측이 Day 15. 모델에 days=15 가 나가야 E3G(estrogen)가 응답에 포함된다
    # (E3G 는 앞 14일을 캘리브레이션에 쓴다). LH 1차 서지는 Day 21.
    cold-start-days: 15

# ============================================================================
# Claude API — L-07(의학 어드바이스) 용. 현재 코드에서 사용처 없음.
# ============================================================================
# ============================================================================
# Claude API — "오늘의 조언" 기능.
# api-key 가 비어 있으면 기능 자체가 꺼진다 (호출하지 않고 화면에 안내만 뜬다).
# ============================================================================
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  # Sonnet 을 쓴다. Opus 대비 비용이 1/5 이고(90일 완주 $17 -> $3.4) 응답도 빠르다.
  # 조언 품질은 실측 비교에서 차이가 크지 않았다.
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  # 조언에 실어 보낼 웨어러블 일수. 일차가 늘어도 이 값으로 고정돼 비용이 일정하다.
  # 30일 ≈ 호출당 9천~1만 토큰.
  history-days: ${ADVICE_HISTORY_DAYS:30}
  # §9-9: 1200 -> 2000 으로 올렸는데도 지금 Sonnet 이 400자 지시를 넘겨서 다시 잘렸다
  # (실측: 2000 토큰 꽉 채우고 문장 중간 절단). 4000 으로 재상향.
  max-tokens: ${ADVICE_MAX_TOKENS:4000}
  read-timeout-ms: 60000

logging:
  level:
    com.sixletter.hormone_web_backend: ${LOG_LEVEL:DEBUG}
