# ============================================================================
# 커밋되는 설정 파일. **여기에 비밀번호/API 키를 직접 쓰지 말 것.**
#
# 값 주입 우선순위 (뒤로 갈수록 우선):
#   1) 이 파일의 ${ENV:기본값}  ← CI/배포용
#   2) application-local.yaml   ← 로컬 개발용 (gitignore 처리됨)
#
# spring.profiles.default: local 덕분에 프로필을 지정하지 않아도
# application-local.yaml 이 자동으로 로드된다. 파일이 없어도 부팅은 된다.
#
# 최초 세팅: application-local.yaml.example 를 복사해서
#            application-local.yaml 로 만들고 실제 값 채우기.
# ============================================================================

spring:
  application:
    name: hormone-web-backend

  profiles:
    default: local

  devtools:
    restart:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hormone_web}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # 스키마는 db/schema.sql 이 유일한 진실. 전부 CREATE TABLE IF NOT EXISTS 라
  # 매 부팅 실행돼도 안전하다. 처음부터 다시 만들려면 db/drop.sql 을 수동 실행할 것.
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

  jpa:
    hibernate:
      # 엔티티가 테이블을 자동 생성/변경하지 않게 none 을 유지할 것 (S-03).
      ddl-auto: none
    show-sql: true
    # schema.sql 이 먼저 돌고 나서 EntityManagerFactory 가 뜨도록 보장
    defer-datasource-initialization: false
    # TODO(B-02): DTO 계층 도입 후 open-in-view: false 로 바꿀 것.
    #   지금은 컨트롤러가 LAZY User 를 물고 있는 엔티티를 그대로 직렬화하므로
    #   OSIV 를 끄면 LazyInitializationException 이 난다.

  jackson:
    default-property-inclusion: NON_NULL

server:
  port: ${SERVER_PORT:8085}

# ============================================================================
# 애플리케이션 설정
# ============================================================================
app:
  cors:
    # 프론트 개발 서버(Vite). TODO: 운영 배포 시 실제 도메인으로 제한 (B-03)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  ws:
    endpoint: /ws
    prediction-topic-prefix: /topic/prediction/

  model:
    # 파이썬 예측 서버. TODO: 모델팀에서 실제 주소 받으면 MODEL_BASE_URL 로 주입
    base-url: ${MODEL_BASE_URL:http://127.0.0.1:5000}
    predict-path: ${MODEL_PREDICT_PATH:/predict}
    # false 면 MockPredictionClient 사용 (파이썬 없이 E2E 동작) — B-08
    enabled: ${MODEL_ENABLED:false}
    # SINGLE_DAY | FULL_HISTORY | WINDOW  — 모델팀 확정 전 기본값은 누적 전체
    input-mode: ${MODEL_INPUT_MODE:FULL_HISTORY}
    window-size: 20
    connect-timeout-ms: 3000
    read-timeout-ms: 30000
    # TODO: 인증 방식 모델팀 확인. 비어 있으면 헤더를 붙이지 않는다.
    api-key: ${MODEL_API_KEY:}

  demo:
    user-id: 1
    start-date: 2026-08-13
    # 시드가 있으면 seed_data.json 의 totalDays(90)가 이깁니다. 이 값은 시드가 없을 때만 씁니다.
    total-days: 90
    cold-start-days: 20

# ============================================================================
# Claude API — L-07(의학 어드바이스) 용. 현재 코드에서 사용처 없음.
# ============================================================================
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-5}

logging:
  level:
    com.sixletter.hormone_web_backend: ${LOG_LEVEL:DEBUG}
